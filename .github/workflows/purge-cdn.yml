name: Purge CDN URLs

on:
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge specific URLs
        run: |
          curl -sS -o purge-response.txt -w "%{http_code}" \
            -X POST "https://api.bunny.net/pullzone/6176915/purgeCache" \
            -H "AccessKey: ${{ secrets.BUNNY_ACCESS_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"urls":["https://www.chobble.com/services/","https://www.chobble.com/services/index.html","https://www.chobble.com/examples/gfc-muay-thai/","https://www.chobble.com/examples/gfc-muay-thai/index.html"]}'
          echo
          cat purge-response.txt
