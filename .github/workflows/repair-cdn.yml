name: Repair stale CDN files

on:
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: latest
          cache: npm
      - name: Build site
        run: |
          npm ci
          npx @11ty/eleventy
      - name: Delete and re-upload stale files
        env:
          ZONE: ${{ secrets.BUNNY_STORAGE_ZONE_NAME }}
          PASS: ${{ secrets.BUNNY_STORAGE_ZONE_PASSWORD }}
        run: |
          for path in services/index.html examples/gfc-muay-thai/index.html; do
            echo "Deleting $path"
            curl -sS -o /dev/null -w "%{http_code}\n" \
              -X DELETE "https://storage.bunnycdn.com/$ZONE/$path" \
              -H "AccessKey: $PASS"
            echo "Uploading $path"
            curl -sS -o /dev/null -w "%{http_code}\n" \
              -X PUT "https://storage.bunnycdn.com/$ZONE/$path" \
              -H "AccessKey: $PASS" \
              -H "Content-Type: text/html" \
              --data-binary "@_site/$path"
          done
      - name: Purge affected URLs
        run: |
          curl -sS -o /dev/null -w "%{http_code}\n" \
            -X POST "https://api.bunny.net/pullzone/6176915/purgeCache" \
            -H "AccessKey: ${{ secrets.BUNNY_ACCESS_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"urls":["https://www.chobble.com/services/","https://www.chobble.com/examples/gfc-muay-thai/"]}'
